stages:
  - deploy
    
deploy:
  stage: deploy
  before_script:
    - chmod 400 $PHUB_SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $PHUB_SSH_KEY $PHUB_SERVER_USER@$PHUB_SERVER_IP "
        if [ ! -d "/var/www/apps/erp-dashboard" ]; then git clone git@gitlab.com:programmerzhub/erp-dashboard.git /var/www/apps/erp-dashboard; fi &&
        cd /var/www/apps/erp-dashboard &&
        git checkout main &&
        git pull &&
        docker compose down &&
        docker compose build &&
        docker compose up -d"
  only:
    - main  # Change this to the branch you want to trigger the pipeline on